<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use env(safe-area-inset-*) on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="All aboard the gains train! Log your lifts, watch the numbers go up."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Gains Train</title>
    <script>
      // Light or dark before the app loads, so it starts in the right colours (src/theme.ts
      // keeps it in step from then on).
      try {
        var choice = localStorage.getItem('gains-train-theme') || 'phone'
        var dark =
          choice === 'dark' ||
          (choice === 'phone' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
