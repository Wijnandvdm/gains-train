# On every pull request to main: RELEASE must be valid, and a release needs changelog notes,
# so mistakes show up before merging (the release itself: release.yml).
name: Release check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/release.py check
