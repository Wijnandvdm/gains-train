services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gains
      POSTGRES_PASSWORD: gains
      POSTGRES_DB: gains
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gains"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
