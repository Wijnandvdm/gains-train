# Install once:     pre-commit install --install-hooks -t pre-commit -t pre-push
# Run on all files: pre-commit run --all-files
#
# Frontend tools run from frontend/node_modules (run `npm install` in frontend/ first).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # --- Generic file hygiene -------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # tsconfig allows comments (JSONC)
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # --- Secrets ---------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # --- Frontend (TypeScript/React) -------------------------------------------
  # scripts/frontend-run.sh runs each tool in frontend/ with the Node from frontend/.nvmrc.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: scripts/frontend-run.sh npx prettier --write --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/package-lock\.json$

      - id: oxlint
        name: oxlint
        entry: scripts/frontend-run.sh npx oxlint --deny-warnings
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: tsc
        name: tsc (typecheck)
        entry: scripts/frontend-run.sh npx tsc -b
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      # Unused files, exports, types and packages across the whole frontend (the "knip" section in package.json).
      - id: knip
        name: knip (unused code)
        entry: scripts/frontend-run.sh npx knip --no-progress --cache
        language: system
        files: ^frontend/(src/.*\.(ts|tsx)|package\.json|[^/]*\.(ts|mjs))$
        pass_filenames: false
        stages: [pre-push]

      - id: vitest
        name: vitest
        entry: scripts/frontend-run.sh npx vitest run
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
