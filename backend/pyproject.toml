[project]
name = "gains-train-api"
version = "0.1.0"
description = "gains-train workout tracker API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-auth>=2.58.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
